<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archify Library</title>
  <style>
    :root {
      --bg: #10151b;
      --panel: #182128;
      --panel-2: #12181f;
      --line: #2c3947;
      --text: #e7eef5;
      --muted: #8fa0b2;
      --accent: #3ecf8e;
      --danger: #f07178;
      --warn: #e6b450;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--text);
      font: 14px/1.45 "IBM Plex Sans", "Segoe UI", sans-serif;
      background:
        radial-gradient(900px 420px at 0% 0%, #1a2a22 0%, transparent 60%),
        var(--bg);
      min-height: 100vh;
    }
    .app {
      display: grid;
      grid-template-columns: 300px 1fr;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
    }
    header {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--line);
      background: rgba(16, 21, 27, 0.92);
    }
    .brand { font: 600 1.15rem/1 "IBM Plex Serif", Georgia, serif; margin: 0; }
    .hint { color: var(--muted); font-size: 0.85rem; }
    .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    button, .btn {
      border: 1px solid var(--line);
      background: #243040;
      color: var(--text);
      border-radius: 0.4rem;
      padding: 0.4rem 0.7rem;
      font: inherit;
      cursor: pointer;
    }
    button.primary { border-color: var(--accent); color: var(--accent); }
    button.danger { border-color: var(--danger); color: var(--danger); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    aside {
      border-right: 1px solid var(--line);
      background: var(--panel-2);
      overflow: auto;
      padding: 0.75rem;
    }
    .list-item {
      width: 100%;
      text-align: left;
      margin: 0 0 0.4rem;
      padding: 0.65rem 0.7rem;
      background: var(--panel);
    }
    .list-item[aria-current="true"] { border-color: var(--accent); }
    .list-item .t { font-weight: 600; }
    .list-item .m { color: var(--muted); font-size: 0.78rem; margin-top: 0.2rem; }
    .workspace {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 0;
    }
    .tabs {
      display: flex;
      gap: 0.35rem;
      padding: 0.65rem 0.85rem 0;
      border-bottom: 1px solid var(--line);
    }
    .tabs button[aria-selected="true"] { border-color: var(--accent); color: var(--accent); }
    .pane { min-height: 0; display: none; }
    .pane.active { display: grid; }
    #pane-edit.active {
      grid-template-rows: auto 1fr;
      padding: 0.75rem;
      gap: 0.6rem;
    }
    #pane-view.active { grid-template-rows: 1fr; }
    textarea {
      width: 100%;
      height: 100%;
      min-height: 420px;
      resize: vertical;
      background: #0d1217;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 0.5rem;
      padding: 0.75rem;
      font: 13px/1.45 "IBM Plex Mono", ui-monospace, monospace;
    }
    iframe {
      width: 100%;
      height: calc(100vh - 9rem);
      border: 0;
      background: #000;
    }
    .status {
      padding: 0.55rem 0.85rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.82rem;
      white-space: pre-wrap;
      max-height: 7rem;
      overflow: auto;
    }
    .status.ok { color: var(--accent); }
    .status.err { color: var(--danger); }
    .status.warn { color: var(--warn); }
    dialog {
      border: 1px solid var(--line);
      border-radius: 0.6rem;
      background: var(--panel);
      color: var(--text);
      padding: 1rem;
      width: min(420px, 92vw);
    }
    dialog::backdrop { background: rgba(0,0,0,0.55); }
    dialog label { display: block; margin: 0.55rem 0 0.2rem; color: var(--muted); font-size: 0.82rem; }
    dialog input, dialog select {
      width: 100%;
      background: #0d1217;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 0.35rem;
      padding: 0.45rem 0.55rem;
      font: inherit;
    }
    dialog .row { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1rem; }
    .empty { color: var(--muted); padding: 1rem 0.25rem; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1 class="brand">Archify Library</h1>
        <div class="hint">Edit JSON IR, then Save &amp; Render. Open View for the interactive diagram.</div>
      </div>
      <div class="actions">
        <button type="button" class="primary" id="btn-new">New</button>
        <button type="button" id="btn-validate" disabled>Validate</button>
        <button type="button" class="primary" id="btn-save" disabled>Save &amp; Render</button>
        <button type="button" id="btn-open" disabled>Open HTML</button>
        <button type="button" class="danger" id="btn-delete" disabled>Delete</button>
      </div>
    </header>

    <aside>
      <div id="list" class="empty">Loading…</div>
    </aside>

    <section class="workspace">
      <div class="tabs">
        <button type="button" data-tab="edit" aria-selected="false">Edit JSON</button>
        <button type="button" data-tab="view" aria-selected="true">View</button>
      </div>
      <div id="pane-edit" class="pane">
        <div class="hint" id="current-meta">Select or create a diagram.</div>
        <textarea id="editor" spellcheck="false" disabled placeholder="Diagram JSON IR appears here."></textarea>
      </div>
      <div id="pane-view" class="pane active">
        <iframe id="frame" title="Archify viewer"></iframe>
      </div>
      <div class="status" id="status">Ready.</div>
    </section>
  </div>

  <dialog id="new-dialog">
    <form method="dialog" id="new-form">
      <h3 style="margin:0">New diagram</h3>
      <label for="new-id">ID</label>
      <input id="new-id" name="id" pattern="[a-z0-9][a-z0-9-]{0,62}" required placeholder="my-system">
      <label for="new-type">Type</label>
      <select id="new-type" name="type" required>
        <option value="architecture">architecture</option>
        <option value="workflow">workflow</option>
        <option value="sequence">sequence</option>
        <option value="dataflow">dataflow</option>
        <option value="lifecycle">lifecycle</option>
      </select>
      <label for="new-title">Title</label>
      <input id="new-title" name="title" placeholder="Optional title">
      <div class="row">
        <button type="button" id="new-cancel">Cancel</button>
        <button type="submit" class="primary">Create</button>
      </div>
    </form>
  </dialog>

  <script>
    const state = {
      entries: [],
      currentId: null,
      dirty: false,
    };

    const el = {
      list: document.getElementById('list'),
      editor: document.getElementById('editor'),
      status: document.getElementById('status'),
      meta: document.getElementById('current-meta'),
      frame: document.getElementById('frame'),
      btnValidate: document.getElementById('btn-validate'),
      btnSave: document.getElementById('btn-save'),
      btnOpen: document.getElementById('btn-open'),
      btnDelete: document.getElementById('btn-delete'),
      dialog: document.getElementById('new-dialog'),
    };

    function setStatus(text, kind = '') {
      el.status.textContent = text;
      el.status.className = 'status' + (kind ? ' ' + kind : '');
    }

    function currentEntry() {
      return state.entries.find((e) => e.id === state.currentId) || null;
    }

    function artifactUrl(entry) {
      return '/library/' + entry.artifact + '?t=' + encodeURIComponent(entry.updatedAt || Date.now());
    }

    function setBusy(busy) {
      [el.btnValidate, el.btnSave, el.btnDelete, el.btnOpen].forEach((b) => {
        if (!state.currentId) {
          b.disabled = true;
          return;
        }
        if (b === el.btnOpen) {
          b.disabled = busy || !currentEntry();
          return;
        }
        b.disabled = busy;
      });
      el.editor.disabled = busy || !state.currentId;
    }

    function renderList() {
      if (!state.entries.length) {
        el.list.innerHTML = '<div class="empty">No diagrams yet. Click New.</div>';
        return;
      }
      el.list.innerHTML = state.entries
        .slice()
        .sort((a, b) => a.title.localeCompare(b.title))
        .map((e) => `
          <button type="button" class="list-item" data-id="${e.id}" aria-current="${e.id === state.currentId}">
            <div class="t">${escapeHtml(e.title)}</div>
            <div class="m">${e.type} · ${e.id}</div>
          </button>
        `).join('');
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    async function api(path, options) {
      const res = await fetch(path, {
        headers: { 'Content-Type': 'application/json', ...(options && options.headers) },
        ...options,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const err = new Error(data.error || ('HTTP ' + res.status));
        err.payload = data;
        err.status = res.status;
        throw err;
      }
      return data;
    }

    async function refreshList(selectId) {
      const data = await api('/api/diagrams');
      state.entries = data.entries || [];
      renderList();
      if (selectId) await selectDiagram(selectId);
      else if (state.currentId && state.entries.some((e) => e.id === state.currentId)) {
        /* keep */
      } else if (state.entries[0]) {
        await selectDiagram(state.entries[0].id);
      } else {
        state.currentId = null;
        el.editor.value = '';
        el.editor.disabled = true;
        el.meta.textContent = 'Select or create a diagram.';
        el.frame.src = 'about:blank';
        setBusy(false);
      }
    }

    async function selectDiagram(id) {
      if (state.dirty && state.currentId && state.currentId !== id) {
        if (!confirm('Discard unsaved edits?')) return;
      }
      const data = await api('/api/diagrams/' + encodeURIComponent(id));
      state.currentId = id;
      state.dirty = false;
      el.editor.value = JSON.stringify(data.document, null, 2);
      el.editor.disabled = false;
      el.meta.textContent = data.entry.title + ' · ' + data.entry.type + ' · ' + data.entry.id;
      el.frame.src = artifactUrl(data.entry);
      renderList();
      setBusy(false);
      showTab('view');
      setStatus('Loaded ' + id + '.');
    }

    async function validateCurrent() {
      let document;
      try { document = JSON.parse(el.editor.value); }
      catch (err) { setStatus('JSON parse error: ' + err.message, 'err'); return; }
      setBusy(true);
      setStatus('Validating…', 'warn');
      try {
        const data = await api('/api/diagrams/' + encodeURIComponent(state.currentId), {
          method: 'PUT',
          body: JSON.stringify({ document, validateOnly: true }),
        });
        setStatus('Validate OK.\n' + JSON.stringify(data.validation?.receipt || data.validation, null, 2), 'ok');
      } catch (err) {
        setStatus('Validate failed.\n' + JSON.stringify(err.payload || { message: err.message }, null, 2), 'err');
      } finally {
        setBusy(false);
      }
    }

    async function saveCurrent() {
      let document;
      try { document = JSON.parse(el.editor.value); }
      catch (err) { setStatus('JSON parse error: ' + err.message, 'err'); return; }
      setBusy(true);
      setStatus('Saving and rendering…', 'warn');
      try {
        const data = await api('/api/diagrams/' + encodeURIComponent(state.currentId), {
          method: 'PUT',
          body: JSON.stringify({ document }),
        });
        state.dirty = false;
        const idx = state.entries.findIndex((e) => e.id === state.currentId);
        if (idx >= 0) state.entries[idx] = data.entry;
        renderList();
        el.meta.textContent = data.entry.title + ' · ' + data.entry.type + ' · ' + data.entry.id;
        el.frame.src = artifactUrl(data.entry);
        setStatus('Saved and rendered.\n' + JSON.stringify(data.delivery?.receipt || { ok: true }, null, 2), 'ok');
        showTab('view');
      } catch (err) {
        setStatus('Save failed.\n' + JSON.stringify(err.payload || { message: err.message }, null, 2), 'err');
      } finally {
        setBusy(false);
      }
    }

    async function deleteCurrent() {
      const entry = currentEntry();
      if (!entry) return;
      if (!confirm('Delete "' + entry.title + '" (' + entry.id + ')?')) return;
      setBusy(true);
      try {
        await api('/api/diagrams/' + encodeURIComponent(entry.id), { method: 'DELETE' });
        state.currentId = null;
        state.dirty = false;
        setStatus('Deleted ' + entry.id + '.', 'ok');
        await refreshList();
      } catch (err) {
        setStatus('Delete failed: ' + err.message, 'err');
        setBusy(false);
      }
    }

    async function createDiagram(id, type, title) {
      setBusy(true);
      setStatus('Creating…', 'warn');
      try {
        const data = await api('/api/diagrams', {
          method: 'POST',
          body: JSON.stringify({ id, type, title: title || undefined }),
        });
        state.dirty = false;
        await refreshList(data.entry.id);
        setStatus('Created ' + data.entry.id + '.', 'ok');
        showTab('view');
      } catch (err) {
        setStatus('Create failed.\n' + JSON.stringify(err.payload || { message: err.message }, null, 2), 'err');
        setBusy(false);
      }
    }

    function showTab(name) {
      document.querySelectorAll('.tabs button').forEach((b) => {
        b.setAttribute('aria-selected', String(b.dataset.tab === name));
      });
      document.getElementById('pane-edit').classList.toggle('active', name === 'edit');
      document.getElementById('pane-view').classList.toggle('active', name === 'view');
    }

    el.list.addEventListener('click', (ev) => {
      const btn = ev.target.closest('[data-id]');
      if (btn) selectDiagram(btn.dataset.id);
    });
    el.editor.addEventListener('input', () => { state.dirty = true; });
    document.getElementById('btn-new').addEventListener('click', () => el.dialog.showModal());
    document.getElementById('new-cancel').addEventListener('click', () => el.dialog.close());
    document.getElementById('new-form').addEventListener('submit', (ev) => {
      ev.preventDefault();
      const id = document.getElementById('new-id').value.trim();
      const type = document.getElementById('new-type').value;
      const title = document.getElementById('new-title').value.trim();
      el.dialog.close();
      createDiagram(id, type, title);
    });
    el.btnValidate.addEventListener('click', validateCurrent);
    el.btnSave.addEventListener('click', saveCurrent);
    el.btnDelete.addEventListener('click', deleteCurrent);
    el.btnOpen.addEventListener('click', () => {
      const entry = currentEntry();
      if (entry) window.open(artifactUrl(entry), '_blank');
    });
    document.querySelector('.tabs').addEventListener('click', (ev) => {
      const btn = ev.target.closest('button[data-tab]');
      if (btn) showTab(btn.dataset.tab);
    });

    refreshList().catch((err) => setStatus('Failed to load library: ' + err.message, 'err'));
  </script>
</body>
</html>
